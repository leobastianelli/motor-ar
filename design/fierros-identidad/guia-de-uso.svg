  <text x="80" y="535" fill="#101213" font-size="30">Área de respeto</text>
  <text x="80" y="575" fill="#666b6d" font-size="21">Dejar alrededor del logo, como mínimo, el ancho de un bloque del símbolo.</text>
  <path fill="none" stroke="#16658f" stroke-width="3" stroke-dasharray="10 8" d="M80 620h530v170H80z"/>
  <path fill="#101213" d="M130 665h80v80h-80z"/><path fill="#75bee9" d="M148 678h17v15h-17zm17 0h29v15h-29zm-17 20h17v15h-17zm17 0h23v15h-23zm-17 20h17v15h-17z"/>
