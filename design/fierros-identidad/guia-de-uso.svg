  <text x="660" y="666" fill="#101213" font-size="30">Tamaño mínimo</text>
  <text x="660" y="706" fill="#666b6d" font-size="21">Logo horizontal: 96 px de ancho.</text>
  <text x="660" y="740" fill="#666b6d" font-size="21">Símbolo: 16 × 16 px.</text>
  <path fill="#101213" d="M660 770h32v32h-32z"/><path fill="#75bee9" d="M667 775h7v6h-7zm7 0h12v6h-12zm-7 8h7v6h-7zm7 0h9v6h-9zm-7 8h7v6h-7z"/>

  <path fill="#101213" d="M80 870h1040v4H80z"/>
  <text x="80" y="930" fill="#101213" font-size="30">Versiones</text>
  <path fill="#101213" d="M80 970h320v170H80z"/><path fill="#75bee9" d="M130 1010h40v34h-40zm40 0h68v34h-68zm-40 45h40v34h-40zm40 0h52v34h-52zm-40 45h40v20h-40z"/><text x="80" y="1175" fill="#666b6d" font-size="20">Principal: tinta + celeste</text>
  <path fill="#f1f2f0" stroke="#101213" stroke-width="2" d="M440 970h320v170H440z"/><path fill="#101213" d="M490 1010h40v34h-40zm40 0h68v34h-68zm-40 45h40v34h-40zm40 0h52v34h-52zm-40 45h40v20h-40z"/><text x="440" y="1175" fill="#666b6d" font-size="20">Una tinta: negro pleno</text>
  <path fill="#101213" d="M800 970h320v170H800z"/><path fill="#f1f2f0" d="M850 1010h40v34h-40zm40 0h68v34h-68zm-40 45h40v34h-40zm40 0h52v34h-52zm-40 45h40v20h-40z"/><text x="800" y="1175" fill="#666b6d" font-size="20">Negativa: papel sobre tinta</text>

  <path fill="#101213" d="M80 1240h1040v4H80z"/>
  <text x="80" y="1300" fill="#101213" font-size="30">No hacer</text>
  <text x="80" y="1346" fill="#666b6d" font-size="21">No estirar ni inclinar. No agregar sombras, contornos o degradés.</text>
  <text x="80" y="1382" fill="#666b6d" font-size="21">No cambiar el celeste por colores de categorías. No usar sobre fotos con mucho detalle.</text>

  <text x="80" y="1465" fill="#101213" font-size="30">Paleta de marca</text>
