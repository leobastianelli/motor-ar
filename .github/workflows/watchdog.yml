# Vigilante independiente: revisa que el sitio responda y que los datos se estén sincronizando, y avisa por Telegram si no.
# Está aparte del sincronizador a propósito: si el sincronizador deja de correr, este lo nota.
# Sin `schedule`: GitHub Actions descarta la mayoría de las corridas programadas (ver docs/avisos-telegram.md), así que el disparo real cada
# 30 min lo hace cron-job.org contra GET /api/vigilante (misma orquestación, estado en Neon en vez de esta caché). Este workflow queda para
# correrlo a mano (workflow_dispatch) o de respaldo; no lo dispares también con un cron acá, para no mandar avisos duplicados con estados
# distintos (el de acá vive en la caché de Actions, el del endpoint en Neon).
name: Vigilante
on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            src/lib/monitor
          sparse-checkout-cone-mode: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/cache/restore@v4
        with:
          path: .watchdog-state.json
          key: watchdog-state-${{ github.run_id }}
          restore-keys: watchdog-state-

      - name: Vigilar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/watchdog.mjs

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .watchdog-state.json
          key: watchdog-state-${{ github.run_id }}
