# Actualiza la instantánea de la temporada (src/data/season-2026.json) desde las fuentes y la sube al repo.
# Vercel publica solo cada push, así los resultados quedan guardados aunque salgan de la ventana de 10 días del sitio.
name: Sincronizar temporada

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (03:00 en Argentina): después del fin de semana y para tomar rectificaciones.
    - cron: "0 6 * * 1,4"
    # Sábado y domingo a las 03:00 UTC (00:00 en Argentina): cierre de lo corrido el viernes y el sábado.
    - cron: "0 3 * * 6,0"
    # Domingo a las 19:00 UTC (16:00 en Argentina): después de las carreras principales del finde.
    - cron: "0 19 * * 0"
    # Viernes a las 15:00 y 22:00 UTC (12:00 y 19:00 en Argentina): la ACTC publica el cronograma con horas del fin de semana ese día.
    - cron: "0 15,22 * * 5"
    # Jueves a las 14:00 y 20:00 UTC (11:00 y 17:00 en Argentina): los horarios de muchas categorías se conocen el jueves. Cada corrida termina
    # con el guardián, que avisa por Telegram lo que siga faltando.
    - cron: "0 14,20 * * 4"
    # Todos los días a las 09:00 UTC (06:00 en Argentina): cierra el hueco lunes-jueves y trae el resumen diario del guardián.
    - cron: "0 9 * * *"
    # Reintento por hora (de jueves a domingo, 06:20 a 23:20 UTC): sólo sincroniza si una sesión de F1 terminó hace poco y sigue sin resultados
    # (ver la compuerta `gate`). Las demás corridas no pasan por la compuerta: sincronizan siempre.
    - cron: "20 6-23 * * 0,4,5,6"
  workflow_dispatch:
    inputs:
      timing_days:
        description: "Días hacia atrás en los que se vuelven a pedir los resultados por sesión (400 = toda la temporada)"
        required: false
        default: "21"

permissions:
  contents: write

concurrency:
  group: sync-season
  cancel-in-progress: false

jobs:
  # Compuerta: barata (no instala nada). En el reintento horario decide si vale la pena sincronizar; en cualquier otro disparo, sincroniza.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = "20 6-23 * * 0,4,5,6" ]; then
            node scripts/pending-sessions.mjs | tee /tmp/gate.txt
            echo "run=$(grep -q '^Hay resultados' /tmp/gate.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sincronizar
        env:
          TIMING_DAYS: ${{ github.event.inputs.timing_days || '21' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run sync:season

      - name: Subir cambios
        run: |
          git add -N src/data/drivers-2026.json 2>/dev/null || true
          if git diff --quiet -- src/data/season-2026.json src/data/drivers-2026.json; then
            echo "Sin cambios en la temporada ni en los pilotos."
            exit 0
          fi
          # Vercel bloquea deploys cuyo commit no venga de un email asociado a una cuenta de GitHub,
          # así que se commitea con el email de la cuenta en vez de uno de bot.
          git config user.name "fierros-sync"
          git config user.email "leonelbastianelli@gmail.com"
          git add src/data/season-2026.json src/data/drivers-2026.json
          git commit -m "datos: sincronización automática de la temporada"
          git push

      # El guardián revisa qué falta o qué está mal (horarios pendientes, fuentes caídas, tablas viejas, fechas sin confirmar) y avisa por
      # Telegram. Corre siempre, incluso si la sincronización falló. El estado (qué ya se avisó) viaja en la caché.
      - name: Restaurar estado de avisos
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Guardián de datos
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNC_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npm run guardian

      - name: Guardar estado de avisos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
