# Sincroniza la temporada desde las fuentes y la escribe en el almacén (tabla season_versions de Neon), que es lo que lee el sitio; después invalida las
# páginas (/api/refresh). Los borradores para redes ya no salen de aquí: los manda /api/pulso (cron externo cada 5 min, ver
# docs/plan-lanzamiento/01-borradores-para-redes.md). La instantánea src/data/season-2026.json es sólo el respaldo: se sube al repo una vez por día (vercel.json evita redesplegar por ella).
name: Sincronizar temporada

on:
  schedule:
    # Lunes y jueves a las 06:00 UTC (03:00 en Argentina): después del fin de semana y para tomar rectificaciones.
    - cron: "0 6 * * 1,4"
    # Sábado y domingo a las 03:00 UTC (00:00 en Argentina): cierre de lo corrido el viernes y el sábado.
    - cron: "0 3 * * 6,0"
    # Domingo a las 19:00 UTC (16:00 en Argentina): después de las carreras principales del finde.
    - cron: "0 19 * * 0"
    # Viernes a las 15:00 y 22:00 UTC (12:00 y 19:00 en Argentina): la ACTC publica el cronograma con horas del fin de semana ese día.
    - cron: "0 15,22 * * 5"
    # Jueves a las 14:00 y 20:00 UTC (11:00 y 17:00 en Argentina): los horarios de muchas categorías se conocen el jueves. Cada corrida termina
    # con el guardián, que avisa por Telegram lo que siga faltando.
    - cron: "0 14,20 * * 4"
    # Todos los días a las 09:00 UTC (06:00 en Argentina): cierra el hueco lunes-jueves y trae el resumen diario del guardián.
    - cron: "0 9 * * *"
    # Reintento por hora (de jueves a domingo, 06:20 a 23:20 UTC): sólo sincroniza si una sesión de F1 terminó hace poco y sigue sin resultados
    # (ver la compuerta `gate`). Las demás corridas no pasan por la compuerta: sincronizan siempre.
    - cron: "20 6-23 * * 0,4,5,6"
  workflow_dispatch:
    inputs:
      timing_days:
        description: "Días hacia atrás en los que se vuelven a pedir los resultados por sesión (400 = toda la temporada)"
        required: false
        default: "21"

permissions:
  contents: write

concurrency:
  group: sync-season
  cancel-in-progress: false

jobs:
  # Compuerta: barata (no instala nada). En el reintento horario decide si vale la pena sincronizar; en cualquier otro disparo, sincroniza.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      # Node 24 (los scripts importan archivos .ts de datos, que Node sólo lee sin configuración desde la 22.18).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # La compuerta y los borradores leen el almacén (el archivo del repo ya no se actualiza cada hora). Sólo necesitan el driver de Neon, no todo el árbol de dependencias.
      # Sólo lo usa scripts/pending-sessions.mjs, que corre únicamente en el reintento horario: en los demás disparos (manuales incluidos) la compuerta
      # devuelve run=true sin tocar el almacén, así que se ahorran unos 45 s de espera.
      - name: Instalar el driver de Neon
        if: github.event.schedule == '20 6-23 * * 0,4,5,6'
        run: npm install --no-save --no-package-lock --ignore-scripts @neondatabase/serverless
      # Respaldo del refresco caliente por si nadie visita el sitio (el propio sitio lo dispara al renderizar, ver src/app/layout.tsx). Sólo en el
      # reintento horario, que ya corre; el endpoint decide solo si hay algo que traer. Si falla, no frena la compuerta.
      - name: Refresco caliente
        if: github.event.schedule == '20 6-23 * * 0,4,5,6'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -sS --max-time 90 -H "Authorization: Bearer $CRON_SECRET" https://www.somosfierros.ar/api/caliente || echo "El refresco caliente no respondió."
      - id: decide
        env:
          SCHEDULE: ${{ github.event.schedule }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$SCHEDULE" = "20 6-23 * * 0,4,5,6" ]; then
            node scripts/pending-sessions.mjs | tee /tmp/gate.txt
            echo "run=$(grep -q '^Hay resultados' /tmp/gate.txt && echo true || echo false)" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Sincronizar
        # Normalmente tarda ~5 min. Si se traba, que falle y deje pasar a la siguiente corrida en vez de ocupar la cola hasta 90 min.
        timeout-minutes: 30
        env:
          TIMING_DAYS: ${{ github.event.inputs.timing_days || '21' }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Tiene que ser el mismo valor que CRON_SECRET en Vercel: /api/refresh lo exige.
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: npm run sync:season

      # drivers-2026.json lo importa el código, así que su cambio se commitea siempre (y despliega). La instantánea de la temporada es el respaldo:
      # se commitea sólo en la corrida diaria de las 09:00 UTC o a mano.
      - name: Subir cambios
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          FILES="src/data/drivers-2026.json"
          if [ "$SCHEDULE" = "0 9 * * *" ] || [ "$EVENT" = "workflow_dispatch" ]; then
            FILES="$FILES src/data/season-2026.json"
          fi
          git add -N src/data/drivers-2026.json 2>/dev/null || true
          if git diff --quiet -- $FILES; then
            echo "Sin cambios que subir al repo ($FILES)."
            exit 0
          fi
          # Vercel bloquea deploys cuyo commit no venga de un email asociado a una cuenta de GitHub,
          # así que se commitea con el email de la cuenta en vez de uno de bot.
          git config user.name "fierros-sync"
          git config user.email "leonelbastianelli@gmail.com"
          git add $FILES
          git commit -m "datos: sincronización automática de la temporada"
          # La sincronización tarda varios minutos y en ese lapso puede entrar otro commit a main (un PR, otra corrida): en vez de fallar, se
          # reaplica el commit de datos sobre lo nuevo (`-X theirs` en un rebase = gana la instantánea recién generada) y se reintenta.
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "Push rechazado (intento $attempt): se reaplica sobre main."
            git pull --rebase -X theirs origin main
          done
          echo "No se pudo subir la sincronización tras 4 intentos." >&2
          exit 1

      # El guardián revisa qué falta o qué está mal (horarios pendientes, fuentes caídas, tablas viejas, fechas sin confirmar) y avisa por
      # Telegram. Corre siempre, incluso si la sincronización falló. El estado (qué ya se avisó) viaja en la caché.
      - name: Restaurar estado de avisos
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
          restore-keys: alert-state-

      - name: Guardián de datos
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYNC_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Para que revise lo que muestra el sitio (la última versión del almacén), no el archivo del repo.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run guardian

      - name: Guardar estado de avisos
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .alert-state.json
          key: alert-state-${{ github.run_id }}
